<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>保单管家</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#2f6bff;--bg:#f4f6fb;--card:#fff;--text:#1a1f36;--muted:#7a869a;--border:#e9edf5;--danger:#ef4444;--warn:#f59e0b}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:560px;margin:0 auto;position:relative;background:var(--bg)}
header{background:linear-gradient(135deg,#3b76ff,#1e4fd8);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 16px;flex-shrink:0}
.h-title{font-size:19px;font-weight:700}
.h-sub{font-size:12px;opacity:.82;margin-top:2px}
main{flex:1;overflow-y:auto;padding:14px 14px 100px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit}
nav button.active{color:var(--primary)}
nav button svg{width:22px;height:22px}
.fab{position:absolute;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#3b76ff,#1e4fd8);color:#fff;border:0;font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(47,107,255,.42);cursor:pointer;z-index:25;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.fab:active{transform:scale(.94)}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(16,24,40,.06);margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:14px;padding:13px 15px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.stat .num{font-size:22px;font-weight:700;letter-spacing:-.5px}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:1px}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(16,24,40,.06);cursor:pointer}
.item:active{transform:scale(.985)}
.avatar{width:42px;height:42px;border-radius:12px;background:#eaf0ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex-shrink:0}
.avatar.lg{width:54px;height:54px;border-radius:16px;font-size:22px}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center;margin-top:2px}
.sub-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.mini-tag{font-size:10px;background:#f1f4f9;color:#64748b;padding:1px 6px;border-radius:10px}
.right{text-align:right;flex-shrink:0}
.right .num{font-weight:700;font-size:14px;color:var(--primary)}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;flex-shrink:0;white-space:nowrap}
.badge.over{background:#fee2e2;color:#dc2626}
.badge.muted{background:#f1f5f9;color:#94a3b8}
.section-title{font-size:13px;color:var(--muted);font-weight:600;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.section-title:first-child{margin-top:0}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:34px 16px;background:#fff;border-radius:14px}
.searchbar{margin-bottom:12px}
.searchbar input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:14px;font-family:inherit;outline:none;color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:500}
input,textarea,select{width:100%;margin-top:5px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#f8fafc;color:var(--text);outline:none}
textarea{resize:vertical;line-height:1.5}
.btn{padding:11px 16px;border-radius:10px;border:0;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,#3b76ff,#1e4fd8);color:#fff}
.btn.ghost{background:#f1f4f9;color:var(--text)}
.btn.danger{background:#fee2e2;color:var(--danger)}
.btn.full{width:100%}
.danger-t{color:var(--danger)!important}
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.modal-head{font-size:17px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.profile-top{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.pname{font-size:18px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:11px;background:#eef2ff;color:#4f46e5;padding:2px 8px;border-radius:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1;padding:9px 10px;font-size:13.5px;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid #f4f6fb}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex-shrink:0}
.kv span:last-child,.kv b{text-align:right;word-break:break-word}
.policy .money{color:var(--primary);font-weight:700;font-size:14px}
.back{background:none;border:0;color:var(--primary);font-size:14px;font-weight:600;padding:4px 0 12px;cursor:pointer;font-family:inherit}
.tip{font-size:12px;color:var(--muted);text-align:center;padding:10px 16px;line-height:1.6}
.btn-tag{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:13px;font-family:inherit;cursor:pointer}
.btn-tag.active{background:#eef2ff;border-color:var(--primary);color:var(--primary);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="h-title">保单管家</div>
    <div class="h-sub" id="h-sub"></div>
  </header>
  <main id="view"></main>
  <button class="fab" id="fab" onclick="onFab()">+</button>
  <nav id="tabbar">
    <button data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/></svg>
      首页
    </button>
    <button data-tab="customers" onclick="go('customers')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      客户
    </button>
    <button data-tab="products" onclick="go('products')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/></svg>
      产品
    </button>
    <button data-tab="more" onclick="go('more')">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      更多
    </button>
  </nav>
</div>
<script>
var STORE_KEY = 'bxgj_v1';
var CUSTOM_TAGS_KEY = 'bxgj_custom_tags';
var DB = { customers: [], products: [], policies: [], activities: [] };
var route = { name: 'home', param: null };
var custQ = '';
var userCustomTags = [];
try { userCustomTags = JSON.parse(localStorage.getItem(CUSTOM_TAGS_KEY) || '[]'); } catch(e) { userCustomTags = []; }
var DEFAULT_TAGS = ['高价值', '高意向', '有儿子', '有女儿', '已成交', '待跟进', '转介绍', '关注养老', '关注重疾', '预算有限'];

function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      DB.customers = Array.isArray(d.customers) ? d.customers : [];
      DB.products = Array.isArray(d.products) ? d.products : [];
      DB.policies = Array.isArray(d.policies) ? d.policies : [];
      DB.activities = Array.isArray(d.activities) ? d.activities : [];
    }
  } catch(e) {}
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch(e) { alert('保存失败'); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n) { return String(n).padStart(2,'0'); }
function fmtDate(d) { var t = d instanceof Date ? d : new Date(d); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function daysUntil(s) {
  if (!s) return Infinity;
  var t = new Date(); t.setHours(0,0,0,0);
  var d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return Infinity;
  return Math.round((d - t) / 86400000);
}
function fmtMoney(n) {
  n = Number(n) || 0;
  if (n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + '万';
  return n.toLocaleString('zh-CN');
}
function isOverdue(c) {
  if (!c.lastFollowUp) return true;
  return daysUntil(c.lastFollowUp) < -30;
}
function getFollowUpBadge(c) {
  if (!c.lastFollowUp) return '<span class="badge muted">未跟进</span>';
  var d = daysUntil(c.lastFollowUp);
  if (d < -30) return '<span class="badge over">超30天</span>';
  return '<span class="badge muted">' + c.lastFollowUp.slice(5) + '</span>';
}

function go(name, param) {
  route = { name: name, param: param };
  render();
  document.getElementById('view').scrollTop = 0;
}
function onFab() {
  if (route.name === 'products') productForm();
  else customerForm();
}
function render() {
  try {
    var main = document.getElementById('view');
    var fn = routes[route.name] || routes.home;
    main.innerHTML = fn();
    var tabs = document.querySelectorAll('#tabbar button');
    for (var i = 0; i < tabs.length; i++) {
      var t = tabs[i].dataset.tab;
      tabs[i].classList.toggle('active', t === route.name || (t === 'customers' && route.name === 'customer'));
    }
    var showFab = ['home','customers','products'].indexOf(route.name) !== -1;
    document.getElementById('fab').style.display = showFab ? 'flex' : 'none';
    var now = new Date();
    var wd = ['日','一','二','三','四','五','六'][now.getDay()];
    document.getElementById('h-sub').textContent = fmtDate(now) + ' 星期' + wd + ' · 共 ' + DB.customers.length + ' 位客户';
    afterRender();
  } catch(e) {
    document.getElementById('view').innerHTML = '<div style="padding:20px;color:red;">出错了：' + e.message + '</div>';
  }
}

function renderHome() {
  var today = fmtDate(new Date());
  var ym = today.slice(0,7);
  var monthPremium = DB.policies.filter(function(p) { return (p.date||'').slice(0,7) === ym; }).reduce(function(s,p) { return s + (Number(p.amount)||0); }, 0);
  var due = DB.customers.filter(function(c) { return isOverdue(c); }).sort(function(a,b) {
    if (!a.lastFollowUp && !b.lastFollowUp) return 0;
    if (!a.lastFollowUp) return 1;
    if (!b.lastFollowUp) return -1;
    return a.lastFollowUp.localeCompare(b.lastFollowUp);
  });
  var html = '';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="num">' + DB.customers.length + '</div><div class="lbl">客户总数</div></div>';
  html += '<div class="stat"><div class="num">' + DB.policies.length + '</div><div class="lbl">保单总数</div></div>';
  html += '<div class="stat"><div class="num">' + fmtMoney(monthPremium) + '</div><div class="lbl">本月保费(元)</div></div>';
  html += '<div class="stat"><div class="num" style="color:' + (due.length ? 'var(--warn)' : 'inherit') + '">' + due.length + '</div><div class="lbl">超期待跟进</div></div>';
  html += '<div class="stat"><div class="num">' + DB.activities.length + '</div><div class="lbl">活动总次数</div></div>';
  html += '</div>';
  html += '<div class="section-title">待跟进提醒</div>';
  if (!due.length) {
    html += '<div class="empty">暂无需要跟进的客户</div>';
  } else {
    html += due.map(function(c) {
      var txt = c.lastFollowUp ? '已超30天' : '未跟进';
      return '<div class="item" onclick="go(\'customer\',\'' + c.id + '\')">' +
        '<div class="avatar">' + esc((c.name||'?').slice(0,1)) + '</div>' +
        '<div class="grow"><div class="title">' + esc(c.name) + '</div>' +
        '<div class="sub">' + esc(c.phone || '未填手机号') + '</div></div>' +
        '<span class="badge over">' + txt + '</span></div>';
    }).join('');
  }
  var recent = DB.policies.slice().sort(function(a,b) { return (b.date||'').localeCompare(a.date||''); }).slice(0,5);
  if (recent.length) {
    html += '<div class="section-title">最近成交</div>';
    html += recent.map(function(p) {
      var c = DB.customers.find(function(x) { return x.id === p.customerId; });
      return '<div class="item" onclick="go(\'customer\',\'' + p.customerId + '\')">' +
        '<div class="avatar" style="background:#e8f8f0;color:#10b981">' + esc((p.productName||'保').slice(0,1)) + '</div>' +
        '<div class="grow"><div class="title">' + esc(p.productName || '未命名产品') + '</div>' +
        '<div class="sub">' + esc(c ? c.name : '未知客户') + ' · ' + esc(p.date || '') + '</div></div>' +
        '<div class="right"><div class="num">¥' + fmtMoney(p.amount) + '</div></div></div>';
    }).join('');
  }
  if (!DB.customers.length && !DB.products.length) {
    html += '<div class="card" style="text-align:center;margin-top:14px"><div style="font-size:14px;color:var(--muted);margin-bottom:12px">还没有数据，先添加第一位客户吧</div><button class="btn ghost full" onclick="seedDemo()">载入示例数据体验一下</button></div>';
  }
  return html;
}

function custListHTML() {
  var q = custQ.trim().toLowerCase();
  var list = DB.customers.slice();
  if (q) {
    list = list.filter(function(c) {
      return (c.name||'').toLowerCase().indexOf(q) !== -1 ||
        (c.phone||'').indexOf(q) !== -1 ||
        (c.idCard||'').indexOf(q) !== -1 ||
        (c.tags||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  list.sort(function(a,b) {
    var da = a.lastFollowUp ? -daysUntil(a.lastFollowUp) : -99999;
    var db = b.lastFollowUp ? -daysUntil(b.lastFollowUp) : -99999;
    if (da !== db) return db - da;
    return (a.name||'').localeCompare(b.name||'', 'zh');
  });
  if (!list.length) {
    return '<div class="empty">' + (q ? '没有找到匹配的客户' : '还没有客户，点右下角 + 添加') + '</div>';
  }
  return list.map(function(c) {
    var tagArr = (c.tags||'').split(/[,\s，、]+/).filter(Boolean);
    var tagHtml = tagArr.slice(0,3).map(function(t) { return '<span class="mini-tag">' + esc(t) + '</span>'; }).join('');
    var followText = c.lastFollowUp ? '跟进:' + c.lastFollowUp : '未跟进';
    var actCount = DB.activities.filter(function(a) { return a.customerId === c.id; }).length;
    return '<div class="item" onclick="go(\'customer\',\'' + c.id + '\')">' +
      '<div class="avatar">' + esc((c.name||'?').slice(0,1)) + '</div>' +
      '<div class="grow"><div class="title">' + esc(c.name) + '</div>' +
      '<div class="sub"><span>' + esc(c.phone || '未填手机') + '</span>' +
      '<span style="color:var(--muted);font-size:11px">' + followText + '</span>' +
      (actCount ? '<span style="color:var(--primary);font-size:11px">' + actCount + '次活动</span>' : '') +
      '</div>' +
      (tagHtml ? '<div class="sub-tags">' + tagHtml + '</div>' : '') +
      '</div>' + getFollowUpBadge(c) + '</div>';
  }).join('');
}
function renderCustomers() {
  return '<div class="searchbar"><input id="cust-search" placeholder="搜索姓名 / 手机 / 身份证 / 标签" value="' + esc(custQ) + '"></div><div id="cust-list">' + custListHTML() + '</div>';
}

function renderCustomerDetail() {
  var c = DB.customers.find(function(x) { return x.id === route.param; });
  if (!c) return '<div class="empty">客户不存在</div>';
  var pols = DB.policies.filter(function(p) { return p.customerId === c.id; }).sort(function(a,b) { return (b.date||'').localeCompare(a.date||''); });
  var total = pols.reduce(function(s,p) { return s + (Number(p.amount)||0); }, 0);
  var d = c.lastFollowUp ? daysUntil(c.lastFollowUp) : null;
  var acts = DB.activities.filter(function(a) { return a.customerId === c.id; }).sort(function(a,b) { return (b.date||'').localeCompare(a.date||''); });
  var tags = (c.tags||'').split(/[,\s，、]+/).filter(Boolean);
  var html = '';
  html += '<button class="back" onclick="go(\'customers\')">‹ 返回客户列表</button>';
  html += '<div class="card"><div class="profile-top"><div class="avatar lg">' + esc((c.name||'?').slice(0,1)) + '</div><div class="grow"><div class="pname">' + esc(c.name) + '</div><div class="sub">' + esc(c.phone || '未填手机号') + (c.age ? ' · ' + c.age + '岁' : '') + '</div>';
  if (tags.length) html += '<div class="tags">' + tags.map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  html += '</div></div><div class="actions">';
  if (c.phone) html += '<a class="btn ghost" href="tel:' + esc(c.phone) + '">拨打电话</a>';
  html += '<button class="btn ghost" onclick="customerForm(\'' + c.id + '\')">编辑</button><button class="btn ghost danger-t" onclick="delCustomer(\'' + c.id + '\')">删除</button></div></div>';
  html += '<div class="card">';
  html += '<div class="kv"><span>身份证号</span><b>' + esc(c.idCard || '未填') + '</b></div>';
  html += '<div class="kv"><span>最后一次跟进</span><b>' + (c.lastFollowUp ? esc(c.lastFollowUp) + (d !== null ? '（' + (d < 0 ? '已过去' + (-d) + '天' : d === 0 ? '今天' : '还有' + d + '天') + '）' : '') : '未设置') + '</b></div>';
  html += '<div class="kv"><span>累计保费</span><b>¥' + fmtMoney(total) + '</b></div>';
  html += '<div class="kv"><span>活动次数</span><b>' + acts.length + ' 次</b></div>';
  html += '<div class="kv"><span>备注</span><span>' + (c.note ? esc(c.note) : '—') + '</span></div>';
  if (c.idCardImage) html += '<div style="margin-top:10px;"><div style="font-size:13px;color:var(--muted);margin-bottom:5px;">身份证照片：</div><img src="' + c.idCardImage + '" style="width:100%;border-radius:10px;border:1px solid var(--border);" onclick="window.open(this.src)"></div>';
  html += '</div>';
  html += '<div class="section-title"><span>保单记录（' + pols.length + '）</span><button class="link" onclick="policyForm(\'' + c.id + '\')">+ 添加</button></div>';
  if (pols.length) {
    html += pols.map(function(p) {
      return '<div class="card policy" onclick="policyForm(\'' + c.id + '\',\'' + p.id + '\')"><div class="row-between"><b>' + esc(p.productName || '未命名产品') + '</b><span class="money">¥' + fmtMoney(p.amount) + '</span></div><div class="sub" style="margin-top:4px">' + esc(p.date || '未填日期') + (p.note ? ' · ' + esc(p.note) : '') + '</div></div>';
    }).join('');
  } else {
    html += '<div class="empty">还没有保单记录，点上面「+ 添加」</div>';
  }
  html += '<div class="section-title" style="margin-top:20px;"><span>活动记录（' + acts.length + '）</span><button class="link" onclick="activityForm(\'' + c.id + '\')">+ 添加</button></div>';
  if (acts.length) {
    html += acts.map(function(a) {
      return '<div class="card policy" onclick="activityForm(\'' + c.id + '\',\'' + a.id + '\')"><div class="row-between"><b>' + esc(a.name || '活动') + '</b><span class="money">' + esc(a.date) + '</span></div><div class="sub" style="margin-top:4px">' + (a.note ? esc(a.note) : '') + '</div></div>';
    }).join('');
  } else {
    html += '<div class="empty">还没有活动记录，点上面「+ 添加」</div>';
  }

function compressImage(file, callback) {
  var reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = function(e) {
    var img = new Image();
    img.src = e.target.result;
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var w = img.width, h = img.height;
      var maxW = 800;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
  };
}
